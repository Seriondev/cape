name: Build ClientCapes v2 (Fabric 1.21.11 + Server)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Resolve Fabric versions and write project files
        run: |
          set -e
          MC=1.21.11
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -1)
          echo "MC=$MC YARN=$YARN LOADER=$LOADER API=$API"
          if [ -z "$YARN" ] || [ -z "$LOADER" ] || [ -z "$API" ]; then echo "Gagal mengambil versi Fabric"; exit 1; fi

          # ---------------- SERVER (Python 3, tanpa dependensi) ----------------
          cat > cape_server.py <<'EOF'
          #!/usr/bin/env python3
          """ClientCapes server: menyimpan cape PNG per UUID pemain.

          Jalankan:  CAPE_KEY=rahasia PORT=8080 python3 cape_server.py
          Env:
            PORT       port HTTP (default 8080)
            CAPE_KEY   kunci bersama; kosong = tidak ada kunci
            CAPE_DATA  folder penyimpanan (default ./capes)
          """
          import hashlib
          import hmac
          import json
          import os
          import re
          import struct
          import sys
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          PORT = int(os.environ.get("PORT", "8080"))
          KEY = os.environ.get("CAPE_KEY", "")
          DATA = os.environ.get("CAPE_DATA", "capes")
          MAX_BYTES = 1_000_000
          os.makedirs(DATA, exist_ok=True)
          TOKENS_FILE = os.path.join(DATA, "tokens.json")
          LOCK = threading.Lock()
          UUID_RE = re.compile(r"^[0-9a-f]{32}$")
          RATE = {}


          def load_tokens():
              try:
                  with open(TOKENS_FILE, "r", encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return {}


          def save_tokens(t):
              tmp = TOKENS_FILE + ".tmp"
              with open(tmp, "w", encoding="utf-8") as f:
                  json.dump(t, f)
              os.replace(tmp, TOKENS_FILE)


          def norm(u):
              u = u.replace("-", "").lower()
              return u if UUID_RE.match(u) else None


          def png_ok(b):
              if len(b) < 33 or b[:8] != b"\x89PNG\r\n\x1a\n" or b[12:16] != b"IHDR":
                  return False
              w, h = struct.unpack(">II", b[16:24])
              return 64 <= w <= 2048 and w * 32 == h * 64


          def rate_ok(ip):
              now = time.time()
              lst = [t for t in RATE.get(ip, []) if now - t < 60]
              if len(lst) >= 30:
                  RATE[ip] = lst
                  return False
              lst.append(now)
              RATE[ip] = lst
              return True


          class Handler(BaseHTTPRequestHandler):
              server_version = "ClientCapes/1.0"

              def log_message(self, fmt, *args):
                  sys.stderr.write("%s - %s\n" % (self.address_string(), fmt % args))

              def _send(self, code, body=b"", ctype="text/plain; charset=utf-8", headers=None):
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  for k, v in (headers or {}).items():
                      self.send_header(k, v)
                  self.end_headers()
                  if body:
                      self.wfile.write(body)

              def _uuid(self):
                  m = re.match(r"^/cape/([0-9a-fA-F-]{32,36})$", self.path.split("?")[0])
                  return norm(m.group(1)) if m else None

              def _auth(self, u):
                  if KEY and not hmac.compare_digest(self.headers.get("X-Key", ""), KEY):
                      self._send(403, b"kunci salah")
                      return False
                  tok = self.headers.get("X-Token", "")
                  if len(tok) < 16 or len(tok) > 128:
                      self._send(400, b"token tidak valid")
                      return False
                  h = hashlib.sha256(tok.encode()).hexdigest()
                  with LOCK:
                      t = load_tokens()
                      cur = t.get(u)
                      if cur is None:
                          t[u] = h
                          save_tokens(t)
                          return True
                      if hmac.compare_digest(cur, h):
                          return True
                  self._send(403, b"UUID ini sudah diklaim token lain")
                  return False

              def do_GET(self):
                  path = self.path.split("?")[0]
                  if path in ("/", "/health"):
                      return self._send(200, b"ClientCapes server OK\n")
                  u = self._uuid()
                  if not u:
                      return self._send(404, b"not found")
                  try:
                      with open(os.path.join(DATA, u + ".png"), "rb") as f:
                          data = f.read()
                  except OSError:
                      return self._send(404, b"no cape")
                  etag = '"%s"' % hashlib.sha1(data).hexdigest()
                  if self.headers.get("If-None-Match") == etag:
                      return self._send(304, b"", headers={"ETag": etag})
                  self._send(200, data, "image/png", {"ETag": etag, "Cache-Control": "no-cache"})

              def do_PUT(self):
                  u = self._uuid()
                  if not u:
                      return self._send(404, b"not found")
                  if not rate_ok(self.client_address[0]):
                      return self._send(429, b"terlalu sering")
                  try:
                      length = int(self.headers.get("Content-Length", "0"))
                  except ValueError:
                      length = 0
                  if length <= 0 or length > MAX_BYTES:
                      return self._send(413, b"ukuran file tidak valid (maks 1MB)")
                  data = self.rfile.read(length)
                  if not png_ok(data):
                      return self._send(400, b"PNG tidak valid (harus rasio 2:1, min 64 lebar)")
                  if not self._auth(u):
                      return
                  path = os.path.join(DATA, u + ".png")
                  with LOCK:
                      with open(path + ".tmp", "wb") as f:
                          f.write(data)
                      os.replace(path + ".tmp", path)
                  self._send(200, b"ok")

              def do_DELETE(self):
                  u = self._uuid()
                  if not u:
                      return self._send(404, b"not found")
                  if not rate_ok(self.client_address[0]):
                      return self._send(429, b"terlalu sering")
                  if not self._auth(u):
                      return
                  try:
                      os.remove(os.path.join(DATA, u + ".png"))
                  except OSError:
                      pass
                  self._send(200, b"ok")


          if __name__ == "__main__":
              print("ClientCapes server di port %d (kunci: %s)" % (PORT, "ya" if KEY else "tidak"))
              ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()
          EOF

          # ---------------- MOD ----------------
          mkdir -p mod && cd mod
          mkdir -p src/main/java/com/example/clientcapes/mixin
          mkdir -p src/main/resources/assets/clientcapes/lang

          cat > gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=$MC
          yarn_mappings=$YARN
          loader_version=$LOADER
          fabric_version=$API
          mod_version=2.0.0
          maven_group=com.example
          archives_base_name=clientcapes
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'clientcapes'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.14-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = 'UTF-8'
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "clientcapes",
            "version": "${version}",
            "name": "Client Capes",
            "description": "Custom cape client mod with rotating preview, preset capes, custom PNG capes and optional shared-server sync.",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.clientcapes.CapeMod"]
            },
            "mixins": ["clientcapes.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat > src/main/resources/clientcapes.mixins.json <<'EOF'
          {
            "required": false,
            "minVersion": "0.8",
            "package": "com.example.clientcapes.mixin",
            "compatibilityLevel": "JAVA_21",
            "client": [
              "PlayerSkinMixin"
            ],
            "injectors": {
              "defaultRequire": 0
            }
          }
          EOF

          cat > src/main/resources/assets/clientcapes/lang/en_us.json <<'EOF'
          {
            "key.category.clientcapes.main": "Client Capes",
            "key.clientcapes.open": "Open Cape Menu"
          }
          EOF

          cat > src/main/java/com/example/clientcapes/mixin/PlayerSkinMixin.java <<'EOF'
          package com.example.clientcapes.mixin;

          import com.example.clientcapes.CapeManager;
          import net.minecraft.client.network.AbstractClientPlayerEntity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          @Mixin(AbstractClientPlayerEntity.class)
          public abstract class PlayerSkinMixin {
              // Return type SkinTextures sengaja ditulis sebagai Object agar tidak bergantung pada nama class
              @Inject(method = {"getSkinTextures", "getSkin"}, at = @At("RETURN"), cancellable = true, require = 0)
              private void clientcapes$cape(CallbackInfoReturnable<Object> cir) {
                  Object r = CapeManager.override(this, cir.getReturnValue());
                  if (r != null) cir.setReturnValue(r);
              }
          }
          EOF

          cat > src/main/java/com/example/clientcapes/CapeConfig.java <<'EOF'
          package com.example.clientcapes;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.security.SecureRandom;

          public class CapeConfig {
              /** "" = tidak ada, "preset:Nama", atau "file:nama.png" */
              public String capeKey = "";
              public boolean autoSpin = true;

              /** Sinkronisasi lewat server bersama */
              public String serverUrl = "";
              public String serverKey = "";
              public String token = "";
              public boolean showOthers = true;
              public boolean shareOwn = true;

              private static CapeConfig INSTANCE = new CapeConfig();
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              private static Path path() {
                  return FabricLoader.getInstance().getConfigDir().resolve("clientcapes.json");
              }

              public static CapeConfig get() {
                  return INSTANCE;
              }

              public static void load() {
                  try {
                      Path p = path();
                      if (Files.exists(p)) {
                          CapeConfig c = GSON.fromJson(Files.readString(p), CapeConfig.class);
                          if (c != null) {
                              if (c.capeKey == null) c.capeKey = "";
                              if (c.serverUrl == null) c.serverUrl = "";
                              if (c.serverKey == null) c.serverKey = "";
                              if (c.token == null) c.token = "";
                              INSTANCE = c;
                          }
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  if (INSTANCE.token.isEmpty()) {
                      byte[] b = new byte[16];
                      new SecureRandom().nextBytes(b);
                      StringBuilder sb = new StringBuilder();
                      for (byte x : b) sb.append(String.format("%02x", x));
                      INSTANCE.token = sb.toString();
                      save();
                  }
              }

              public static void save() {
                  try {
                      Files.writeString(path(), GSON.toJson(INSTANCE));
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

          cat > src/main/java/com/example/clientcapes/CapeMod.java <<'EOF'
          package com.example.clientcapes;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class CapeMod implements ClientModInitializer {
              public static KeyBinding openKey;

              @Override
              public void onInitializeClient() {
                  CapeConfig.load();

                  KeyBinding.Category cat = KeyBinding.Category.create(Identifier.of("clientcapes", "main"));
                  openKey = KeyBindingHelper.registerKeyBinding(
                          new KeyBinding("key.clientcapes.open", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_G, cat));

                  ClientTickEvents.END_CLIENT_TICK.register(mc -> {
                      CapeSync.tick(mc);
                      while (openKey.wasPressed()) {
                          if (mc.currentScreen == null) mc.setScreen(new CapeScreen());
                      }
                  });
              }
          }
          EOF

          cat > src/main/java/com/example/clientcapes/CapeData.java <<'EOF'
          package com.example.clientcapes;

          /** Tekstur cape dalam format kanvas 2:1 (64x32 atau kelipatannya), piksel ARGB. */
          public class CapeData {
              public final int w, h;
              public final int[] px;
              public final int avg;

              public CapeData(int w, int h, int[] px) {
                  this.w = w;
                  this.h = h;
                  this.px = px;
                  this.avg = computeAvg(px);
              }

              public static int computeAvg(int[] px) {
                  long r = 0, g = 0, b = 0, n = 0;
                  for (int c : px) {
                      if ((c >>> 24) < 128) continue;
                      r += (c >> 16) & 255;
                      g += (c >> 8) & 255;
                      b += c & 255;
                      n++;
                  }
                  if (n == 0) return 0xFF808080;
                  return 0xFF000000 | ((int) (r / n) << 16) | ((int) (g / n) << 8) | (int) (b / n);
              }

              /** Ambil warna pada koordinat tekstur 64x32 (boleh pecahan). */
              public int sample(double tx, double ty) {
                  double s = w / 64.0;
                  int x = (int) (tx * s), y = (int) (ty * s);
                  if (x < 0) x = 0;
                  if (y < 0) y = 0;
                  if (x >= w) x = w - 1;
                  if (y >= h) y = h - 1;
                  return px[y * w + x];
              }
          }
          EOF

          cat > src/main/java/com/example/clientcapes/Capes.java <<'EOF'
          package com.example.clientcapes;

          import net.fabricmc.loader.api.FabricLoader;
          import net.minecraft.client.texture.NativeImage;

          import java.io.ByteArrayInputStream;
          import java.io.InputStream;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.stream.Stream;

          public class Capes {
              public record Entry(String key, String name, boolean custom) {
              }

              public static final String[] PRESETS = {
                      "Merah", "Biru Laut", "Hijau Hutan", "Ungu Malam", "Emas",
                      "Pelangi", "Catur", "Api", "Es"
              };

              private static final Map<String, CapeData> CACHE = new HashMap<>();

              public static Path dir() {
                  return FabricLoader.getInstance().getGameDir().resolve("clientcapes");
              }

              public static void clearCache() {
                  CACHE.clear();
                  CapeManager.invalidate();
              }

              public static List<Entry> entries() {
                  List<Entry> l = new ArrayList<>();
                  l.add(new Entry("", "Tanpa Cape", false));
                  for (String p : PRESETS) l.add(new Entry("preset:" + p, p, false));
                  try {
                      Files.createDirectories(dir());
                      try (Stream<Path> s = Files.list(dir())) {
                          s.filter(f -> f.getFileName().toString().toLowerCase(Locale.ROOT).endsWith(".png"))
                                  .sorted()
                                  .forEach(f -> {
                                      String n = f.getFileName().toString();
                                      l.add(new Entry("file:" + n, n.substring(0, n.length() - 4), true));
                                  });
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
                  return l;
              }

              public static CapeData get(String key) {
                  if (key == null || key.isEmpty()) return null;
                  CapeData c = CACHE.get(key);
                  if (c != null) return c;
                  try {
                      if (key.startsWith("preset:")) {
                          String name = key.substring(7);
                          for (int i = 0; i < PRESETS.length; i++) {
                              if (PRESETS[i].equals(name)) {
                                  c = preset(i);
                                  break;
                              }
                          }
                      } else if (key.startsWith("file:")) {
                          c = fromFile(dir().resolve(key.substring(5)));
                      }
                  } catch (Throwable t) {
                      t.printStackTrace();
                  }
                  if (c != null) CACHE.put(key, c);
                  return c;
              }

              // ---------- baca / tulis gambar ----------

              private static CapeData fromImage(NativeImage img) {
                  int w = img.getWidth(), h = img.getHeight();
                  if (w < 2 || h < 2 || w > 4096 || h > 4096) return null;
                  int[] px = new int[w * h];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          px[y * w + x] = img.getColorArgb(x, y);
                      }
                  }
                  return normalize(px, w, h);
              }

              private static CapeData fromFile(Path p) throws Exception {
                  if (!Files.exists(p)) return null;
                  try (InputStream in = Files.newInputStream(p)) {
                      NativeImage img = NativeImage.read(in);
                      try {
                          return fromImage(img);
                      } finally {
                          img.close();
                      }
                  }
              }

              public static CapeData fromBytes(byte[] bytes) throws Exception {
                  NativeImage img = NativeImage.read(new ByteArrayInputStream(bytes));
                  try {
                      return fromImage(img);
                  } finally {
                      img.close();
                  }
              }

              public static byte[] toPng(CapeData d) throws Exception {
                  NativeImage img = new NativeImage(NativeImage.Format.RGBA, d.w, d.h, false);
                  Path tmp = null;
                  try {
                      for (int y = 0; y < d.h; y++) {
                          for (int x = 0; x < d.w; x++) {
                              img.setColorArgb(x, y, d.px[y * d.w + x]);
                          }
                      }
                      tmp = Files.createTempFile("clientcapes", ".png");
                      img.writeTo(tmp);
                      return Files.readAllBytes(tmp);
                  } finally {
                      img.close();
                      if (tmp != null) Files.deleteIfExists(tmp);
                  }
              }

              // ---------- normalisasi ke layout cape ----------

              private static void fillRect(int[] out, int W, int x0, int y0, int x1, int y1, int col) {
                  for (int y = y0; y < y1; y++) {
                      for (int x = x0; x < x1; x++) {
                          out[y * W + x] = col;
                      }
                  }
              }

              private static int shade(int argb, double f) {
                  int r = Math.min(255, (int) (((argb >> 16) & 255) * f));
                  int g = Math.min(255, (int) (((argb >> 8) & 255) * f));
                  int b = Math.min(255, (int) ((argb & 255) * f));
                  return 0xFF000000 | (r << 16) | (g << 8) | b;
              }

              static CapeData normalize(int[] src, int sw, int sh) {
                  // Sudah format cape/elytra 2:1 (mis. 64x32, 128x64)
                  if (sw >= 64 && sw * 32 == sh * 64) return new CapeData(sw, sh, src);

                  int avg = CapeData.computeAvg(src);
                  int s, W, H;
                  int[] out;

                  if (sw * 17 == sh * 22 && sw % 22 == 0) {
                      // Format OptiFine 22x17 (atau kelipatannya)
                      s = sw / 22;
                      W = 64 * s;
                      H = 32 * s;
                      out = new int[W * H];
                      for (int y = 0; y < sh; y++) {
                          for (int x = 0; x < sw; x++) {
                              out[y * W + x] = src[y * sw + x];
                          }
                      }
                  } else {
                      // Gambar bebas: skala ke sisi luar cape (10x16)
                      s = 8;
                      W = 512;
                      H = 256;
                      out = new int[W * H];
                      int fx = s, fy = s, fw = 10 * s, fh = 16 * s;
                      for (int y = 0; y < fh; y++) {
                          for (int x = 0; x < fw; x++) {
                              int c = src[(y * sh / fh) * sw + (x * sw / fw)];
                              if ((c >>> 24) < 128) c = avg;
                              out[(fy + y) * W + fx + x] = c | 0xFF000000;
                          }
                      }
                      fillRect(out, W, 12 * s, s, 22 * s, 17 * s, shade(avg, 0.7)); // sisi dalam
                      fillRect(out, W, 0, s, s, 17 * s, shade(avg, 0.85));            // samping
                      fillRect(out, W, 11 * s, s, 12 * s, 17 * s, shade(avg, 0.85));
                      fillRect(out, W, s, 0, 11 * s, s, shade(avg, 0.85));            // atas
                      fillRect(out, W, 11 * s, 0, 21 * s, s, shade(avg, 0.85));       // bawah
                  }
                  // Area elytra (22..46 x 0..22) diisi warna rata-rata supaya sayap tetap terlihat
                  fillRect(out, W, 22 * s, 0, 46 * s, 22 * s, avg);
                  return new CapeData(W, H, out);
              }

              // ---------- preset buatan kode ----------

              private static int clamp(int v) {
                  return v < 0 ? 0 : Math.min(v, 255);
              }

              private static int rgb(int r, int g, int b) {
                  return 0xFF000000 | (clamp(r) << 16) | (clamp(g) << 8) | clamp(b);
              }

              private static int lerp(int a, int b, double t) {
                  int r = (int) (((a >> 16) & 255) * (1 - t) + ((b >> 16) & 255) * t);
                  int g = (int) (((a >> 8) & 255) * (1 - t) + ((b >> 8) & 255) * t);
                  int bl = (int) ((a & 255) * (1 - t) + (b & 255) * t);
                  return rgb(r, g, bl);
              }

              private static int hash(int x, int y) {
                  int h = x * 374761393 + y * 668265263;
                  h = (h ^ (h >>> 13)) * 1274126177;
                  return (h ^ (h >>> 16)) & 0x7FFFFFFF;
              }

              private static int hsv(double h) {
                  double r = 0, g = 0, b = 0;
                  double x = h * 6;
                  int i = ((int) Math.floor(x)) % 6;
                  double f = x - Math.floor(x), q = 1 - f;
                  switch (i) {
                      case 0 -> {
                          r = 1;
                          g = f;
                      }
                      case 1 -> {
                          r = q;
                          g = 1;
                      }
                      case 2 -> {
                          g = 1;
                          b = f;
                      }
                      case 3 -> {
                          g = q;
                          b = 1;
                      }
                      case 4 -> {
                          r = f;
                          b = 1;
                      }
                      default -> {
                          r = 1;
                          b = q;
                      }
                  }
                  return rgb((int) (r * 255), (int) (g * 255), (int) (b * 255));
              }

              private static int presetColor(int idx, double u, double v, int hx, int hy) {
                  switch (idx) {
                      case 0 -> {
                          int c = rgb(200, 30, 40);
                          if (Math.abs(u - 0.5) < 0.09) c = rgb(240, 200, 60);
                          return c;
                      }
                      case 1 -> {
                          return lerp(rgb(10, 40, 140), rgb(40, 200, 230), v);
                      }
                      case 2 -> {
                          int c = lerp(rgb(20, 90, 30), rgb(60, 170, 70), v);
                          if (((hx + hy) & 1) == 0) c = shade(c, 0.88);
                          return c;
                      }
                      case 3 -> {
                          int c = lerp(rgb(30, 10, 70), rgb(95, 35, 145), v);
                          if (hash(hx, hy) % 19 == 0) c = rgb(255, 255, 210);
                          return c;
                      }
                      case 4 -> {
                          return ((int) (u * 10)) % 2 == 0 ? rgb(235, 195, 45) : rgb(190, 150, 20);
                      }
                      case 5 -> {
                          return hsv(Math.min(0.999, u));
                      }
                      case 6 -> {
                          return ((((int) (u * 8)) + ((int) (v * 12))) & 1) == 0 ? rgb(245, 245, 245) : rgb(25, 25, 25);
                      }
                      case 7 -> {
                          return lerp(rgb(200, 20, 10), rgb(255, 225, 60), v);
                      }
                      default -> {
                          int c = lerp(rgb(165, 215, 255), rgb(235, 248, 255), v);
                          if (hash(hx, hy) % 17 == 0) c = rgb(255, 255, 255);
                          return c;
                      }
                  }
              }

              private static CapeData preset(int idx) {
                  int W = 64, H = 32;
                  int[] px = new int[W * H];

                  // Area cape: x 0..21, y 0..16
                  for (int y = 0; y <= 16; y++) {
                      for (int x = 0; x <= 21; x++) {
                          boolean outer = x >= 1 && x <= 10;
                          boolean inner = x >= 12 && x <= 21;
                          double u = outer ? (x - 1 + 0.5) / 10.0 : inner ? (x - 12 + 0.5) / 10.0 : 0.5;
                          double v = Math.max(0, Math.min(1, (y - 1 + 0.5) / 16.0));
                          int c = presetColor(idx, u, v, x, y);
                          if (outer && (u < 0.06 || u > 0.94 || v < 0.04 || v > 0.96)) c = shade(c, 0.78);
                          if (inner) c = shade(c, 0.7);
                          px[y * W + x] = c;
                      }
                  }
                  // Area elytra: x 22..45, y 0..21
                  for (int y = 0; y < 22; y++) {
                      for (int x = 22; x < 46; x++) {
                          double u = (x - 22 + 0.5) / 24.0;
                          double v = (y + 0.5) / 22.0;
                          int c = presetColor(idx, u, v, x, y);
                          if (u < 0.05 || u > 0.95 || v < 0.04 || v > 0.96) c = shade(c, 0.8);
                          px[y * W + x] = c;
                      }
                  }
                  return new CapeData(W, H, px);
              }
          }
