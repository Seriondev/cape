          package com.example.clientcapes;

          import net.minecraft.client.MinecraftClient;

          import java.util.UUID;

          /** Mengunggah cape pilihanmu ke server saat masuk dunia atau setelah kamu menekan Select. */
          public class CapeSync {
              public static volatile boolean needUpload = false;
              private static boolean joined = false;

              public static void tick(MinecraftClient mc) {
                  if (mc.player == null) {
                      joined = false;
                      return;
                  }
                  if (!joined) {
                      joined = true;
                      needUpload = true;
                  }
                  if (!needUpload) return;

                  CapeConfig c = CapeConfig.get();
                  needUpload = false;
                  if (!CapeNet.enabled() || !c.shareOwn) return;

                  UUID u = mc.player.getUuid();
                  String key = c.capeKey;
                  if (key == null || key.isEmpty()) {
                      CapeNet.delete(u);
                      return;
                  }
                  CapeData d = Capes.get(key);
                  if (d == null) {
                      CapeNet.status = "Cape yang dipilih tidak ditemukan";
                      return;
                  }
                  try {
                      byte[] png = Capes.toPng(d);
                      if (png.length > 1_000_000) {
                          CapeNet.status = "Cape terlalu besar (maks 1MB)";
                          return;
                      }
                      CapeNet.upload(u, png);
                  } catch (Exception e) {
                      CapeNet.status = "Gagal menyiapkan cape: " + e.getMessage();
                  }
              }
          }
