          package com.example.clientcapes;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.util.Identifier;

          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          /** Menyimpan cape pemain lain yang diambil dari server. */
          public class RemoteCapes {
              private static class St {
                  volatile Identifier id;
                  volatile String etag;
                  volatile long lastCheck;
                  volatile boolean inFlight;
                  volatile boolean ready;
              }

              private static final Map<UUID, St> MAP = new ConcurrentHashMap<>();
              private static final long RECHECK_MS = 120_000L;

              public static void reset() {
                  MAP.clear();
              }

              /** Mengembalikan id tekstur cape pemain ini, atau null bila belum ada. Memicu pengambilan data bila perlu. */
              public static Identifier idFor(UUID u) {
                  if (!CapeNet.enabled()) return null;
                  St s = MAP.computeIfAbsent(u, k -> new St());
                  long now = System.currentTimeMillis();
                  if (!s.inFlight && now - s.lastCheck > RECHECK_MS) {
                      s.inFlight = true;
                      s.lastCheck = now;
                      CapeNet.fetch(u, s.etag, res -> handle(u, s, res));
                  }
                  return s.ready ? s.id : null;
              }

              private static void handle(UUID u, St s, CapeNet.Result res) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  mc.execute(() -> {
                      try {
                          if (res.code() == 200 && res.body() != null) {
                              CapeData d = Capes.fromBytes(res.body());
                              if (d != null) {
                                  Identifier id = Identifier.of("clientcapes", "remote/" + u);
                                  CapeManager.register(mc, id, d);
                                  s.id = id;
                                  s.etag = res.etag();
                                  s.ready = true;
                              }
                          } else if (res.code() == 404) {
                              s.ready = false;
                              s.etag = null;
                          }
                          // 304 = tidak berubah, kode lain/gagal = coba lagi nanti
                      } catch (Throwable t) {
                          System.err.println("[ClientCapes] Gagal memuat cape pemain lain: " + t);
                      } finally {
                          s.inFlight = false;
                      }
                  });
              }
          }
