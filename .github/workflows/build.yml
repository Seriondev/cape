          package com.example.clientcapes;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URI;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.function.Consumer;

          /** Komunikasi dengan server cape (HTTP sederhana, tanpa dependensi tambahan). */
          public class CapeNet {
              public record Result(int code, byte[] body, String etag) {
              }

              private interface Task {
                  void run() throws Exception;
              }

              private static final ExecutorService POOL = Executors.newFixedThreadPool(2, r -> {
                  Thread t = new Thread(r, "clientcapes-net");
                  t.setDaemon(true);
                  return t;
              });

              /** Status terakhir untuk ditampilkan di UI. */
              public static volatile String status = "";

              private static String base() {
                  String u = CapeConfig.get().serverUrl == null ? "" : CapeConfig.get().serverUrl.trim();
                  while (u.endsWith("/")) u = u.substring(0, u.length() - 1);
                  return u;
              }

              public static boolean enabled() {
                  return !base().isEmpty();
              }

              private static HttpURLConnection open(String path, String method) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) URI.create(base() + path).toURL().openConnection();
                  c.setRequestMethod(method);
                  c.setConnectTimeout(8000);
                  c.setReadTimeout(15000);
                  c.setRequestProperty("X-Key", CapeConfig.get().serverKey == null ? "" : CapeConfig.get().serverKey);
                  c.setRequestProperty("X-Token", CapeConfig.get().token);
                  return c;
              }

              private static String readSmall(InputStream in) {
                  if (in == null) return "";
                  try (in) {
                      byte[] b = in.readNBytes(200);
                      return new String(b);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static void async(Task t) {
                  POOL.execute(() -> {
                      try {
                          t.run();
                      } catch (Exception e) {
                          status = "Gagal: " + e.getClass().getSimpleName() + " " + e.getMessage();
                      }
                  });
              }

              public static void upload(UUID u, byte[] png) {
                  status = "Mengunggah cape...";
                  async(() -> {
                      HttpURLConnection c = open("/cape/" + u, "PUT");
                      c.setDoOutput(true);
                      c.setFixedLengthStreamingMode(png.length);
                      c.setRequestProperty("Content-Type", "image/png");
                      try (OutputStream o = c.getOutputStream()) {
                          o.write(png);
                      }
                      int code = c.getResponseCode();
                      status = code == 200 ? "Cape terkirim ke server"
                              : "Gagal kirim (" + code + "): " + readSmall(code >= 400 ? c.getErrorStream() : c.getInputStream());
                  });
              }

              public static void delete(UUID u) {
                  async(() -> {
                      HttpURLConnection c = open("/cape/" + u, "DELETE");
                      int code = c.getResponseCode();
                      status = code == 200 ? "Cape dihapus dari server"
                              : "Gagal hapus (" + code + "): " + readSmall(code >= 400 ? c.getErrorStream() : c.getInputStream());
                  });
              }

              /** Ambil cape pemain lain. Callback dipanggil dari thread jaringan. */
              public static void fetch(UUID u, String etag, Consumer<Result> cb) {
                  POOL.execute(() -> {
                      try {
                          HttpURLConnection c = open("/cape/" + u, "GET");
                          if (etag != null) c.setRequestProperty("If-None-Match", etag);
                          int code = c.getResponseCode();
                          String newTag = c.getHeaderField("ETag");
                          if (code == 200) {
                              try (InputStream in = c.getInputStream()) {
                                  byte[] body = in.readNBytes(2_000_000);
                                  cb.accept(new Result(200, body, newTag));
                              }
                          } else {
                              cb.accept(new Result(code, null, newTag));
                          }
                      } catch (Exception e) {
                          cb.accept(new Result(-1, null, null));
                      }
                  });
              }
          }
