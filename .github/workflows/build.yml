          cat > src/main/java/com/example/clientcapes/CapeManager.java <<'EOF'
          package com.example.clientcapes;

          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.texture.AbstractTexture;
          import net.minecraft.client.texture.NativeImage;
          import net.minecraft.client.texture.NativeImageBackedTexture;
          import net.minecraft.entity.Entity;
          import net.minecraft.util.Identifier;

          import java.lang.reflect.Constructor;
          import java.lang.reflect.Method;
          import java.lang.reflect.RecordComponent;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;
          import java.util.function.Supplier;

          /**
           * Mengganti tekstur cape pemain (kamu sendiri dan pemain lain yang punya cape di server).
           * Pembuatan objek SkinTextures dilakukan lewat refleksi pada record-nya, sehingga tidak
           * bergantung pada nama class yang berubah antar versi.
           */
          public class CapeManager {
              public static final Identifier ID = Identifier.of("clientcapes", "cape/active");

              private static String loadedKey = null;
              private static boolean active = false;
              private static boolean warned = false;
              private static final Map<UUID, Object[]> CACHE = new HashMap<>();

              public static void invalidate() {
                  loadedKey = null;
              }

              private static AbstractTexture makeTexture(NativeImage img) throws Exception {
                  for (Constructor<?> k : NativeImageBackedTexture.class.getConstructors()) {
                      Class<?>[] p = k.getParameterTypes();
                      if (p.length == 1 && p[0] == NativeImage.class) {
                          return (AbstractTexture) k.newInstance(img);
                      }
                  }
                  for (Constructor<?> k : NativeImageBackedTexture.class.getConstructors()) {
                      Class<?>[] p = k.getParameterTypes();
                      if (p.length == 2 && p[1] == NativeImage.class) {
                          if (p[0] == Supplier.class) {
                              Supplier<String> name = () -> "clientcapes cape";
                              return (AbstractTexture) k.newInstance(name, img);
                          }
                          if (p[0] == String.class) {
                              return (AbstractTexture) k.newInstance("clientcapes cape", img);
                          }
                      }
                  }
                  throw new IllegalStateException("Konstruktor NativeImageBackedTexture tidak cocok");
              }

              /** Daftarkan tekstur cape ke TextureManager dengan id tertentu (harus di render thread). */
              public static void register(MinecraftClient mc, Identifier id, CapeData d) throws Exception {
                  NativeImage img = new NativeImage(NativeImage.Format.RGBA, d.w, d.h, false);
                  for (int y = 0; y < d.h; y++) {
                      for (int x = 0; x < d.w; x++) {
                          img.setColorArgb(x, y, d.px[y * d.w + x]);
                      }
                  }
                  AbstractTexture tex = makeTexture(img);
                  try {
                      Method up = tex.getClass().getMethod("upload");
                      up.invoke(tex);
                  } catch (Throwable ignored) {
                  }
                  mc.getTextureManager().registerTexture(id, tex);
              }

              private static void ensureLoaded(MinecraftClient mc) {
                  String key = CapeConfig.get().capeKey;
                  if (key == null) key = "";
                  if (key.equals(loadedKey)) return;

                  loadedKey = key;
                  active = false;
                  if (key.isEmpty()) return;

                  CapeData d = Capes.get(key);
                  if (d == null) return;
                  try {
                      register(mc, ID, d);
                      active = true;
                  } catch (Throwable t) {
                      System.err.println("[ClientCapes] Gagal memuat cape: " + t);
                  }
              }

              private static Object makeAsset(Class<?> type, Object body, Identifier id) throws Exception {
                  if (type == Identifier.class) return id;
                  Class<?> bc = body.getClass();
                  for (Constructor<?> k : bc.getDeclaredConstructors()) {
                      Class<?>[] p = k.getParameterTypes();
                      boolean all = p.length > 0;
                      for (Class<?> q : p) {
                          if (q != Identifier.class) all = false;
                      }
                      if (all) {
                          k.setAccessible(true);
                          Object[] a = new Object[p.length];
                          Arrays.fill(a, id);
                          return k.newInstance(a);
                      }
                  }
                  throw new IllegalStateException("Konstruktor asset tidak ditemukan");
              }

              private static Object build(Object original, Identifier id) {
                  try {
                      Class<?> c = original.getClass();
                      RecordComponent[] rc = c.getRecordComponents();
                      if (rc == null || rc.length < 3) return null;

                      Object[] vals = new Object[rc.length];
                      Class<?>[] types = new Class<?>[rc.length];
                      for (int i = 0; i < rc.length; i++) {
                          Method m = rc[i].getAccessor();
                          m.setAccessible(true);
                          vals[i] = m.invoke(original);
                          types[i] = rc[i].getType();
                      }

                      // Komponen bertipe sama dengan komponen pertama: [0]=badan, [1]=cape, [2]=elytra
                      Class<?> t0 = types[0];
                      int seen = 0, capeIdx = -1, elyIdx = -1;
                      for (int i = 0; i < rc.length; i++) {
                          if (types[i] == t0) {
                              if (seen == 1) capeIdx = i;
                              else if (seen == 2) elyIdx = i;
                              seen++;
                          }
                      }
                      if (capeIdx < 0) return null;

                      vals[capeIdx] = makeAsset(t0, vals[0], id);
                      if (elyIdx >= 0) vals[elyIdx] = makeAsset(t0, vals[0], id);

                      Constructor<?> k = c.getDeclaredConstructor(types);
                      k.setAccessible(true);
                      return k.newInstance(vals);
                  } catch (Throwable t) {
                      if (!warned) {
                          warned = true;
                          System.err.println("[ClientCapes] Gagal menerapkan cape: " + t);
                      }
                      return null;
                  }
              }

              /** Dipanggil dari mixin. Mengembalikan SkinTextures baru, atau null jika tidak diubah. */
              public static Object override(Object self, Object original) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (original == null || mc.player == null || !mc.isOnThread()) return null;
                  if (!(self instanceof Entity e)) return null;

                  Identifier id;
                  if (e == mc.player) {
                      ensureLoaded(mc);
                      if (!active) return null;
                      id = ID;
                  } else {
                      if (!CapeConfig.get().showOthers) return null;
                      id = RemoteCapes.idFor(e.getUuid());
                      if (id == null) return null;
                  }

                  UUID u = e.getUuid();
                  Object[] c = CACHE.get(u);
                  if (c != null && c[0] == original && id.equals(c[2])) return c[1];

                  Object res = build(original, id);
                  if (res != null) CACHE.put(u, new Object[]{original, res, id});
                  return res;
              }
          }
