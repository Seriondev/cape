              }

              @Override
              public void render(DrawContext c, int mx, int my, float d) {
                  super.render(c, mx, my, d);
                  c.fill(px + 10, py + 8, px + 140, py + 28, Ui.PILL);
                  c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Server Cape"), px + 75, py + 14, 0xFFFFFFFF);
                  c.drawTextWithShadow(this.textRenderer, Text.literal("URL Server"), px + 12, py + 34, 0xFFFFFFFF);
                  c.drawTextWithShadow(this.textRenderer, Text.literal("Kunci Server (opsional)"), px + 12, py + 70, 0xFFFFFFFF);
                  String st = CapeNet.status == null ? "" : CapeNet.status;
                  c.drawTextWithShadow(this.textRenderer,
                          Text.literal(this.textRenderer.trimToWidth(st, pw - 24)), px + 12, py + ph - 26, 0xFFFFDD66);
                  c.drawTextWithShadow(this.textRenderer,
                          Text.literal(this.textRenderer.trimToWidth("Semua teman harus pakai URL dan kunci yang sama.", pw - 24)),
