          package com.example.clientcapes;

          import net.minecraft.client.gui.DrawContext;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;

          /** Preview pemain + cape yang bisa diputar, digambar dengan kotak 2D (proyeksi ortografis sumbu Y). */
          public class Preview {
              private interface Tex {
                  int at(double u, double v);
              }

              private record Job(double depth, Runnable run) {
              }

              private static int shade(int argb, double f) {
                  int a = argb >>> 24;
                  int r = Math.min(255, (int) (((argb >> 16) & 255) * f));
                  int g = Math.min(255, (int) (((argb >> 8) & 255) * f));
                  int b = Math.min(255, (int) ((argb & 255) * f));
                  return (a << 24) | (r << 16) | (g << 8) | b;
              }

              private static Tex solid(int c) {
                  return (u, v) -> c;
              }

              private static void face(List<Job> jobs, DrawContext ctx, double th, int cx, int baseY, float k,
                                       double fcx, double fcz, double nx, double nz, double len,
                                       double y0, double y1, Tex tex, int cols, int rows) {
                  double c = Math.cos(th), s = Math.sin(th);
                  double nzr = -nx * s + nz * c;
                  if (nzr <= 0.01) return;

                  double tx = nz, tz = -nx;
                  double ax = fcx - tx * len, az = fcz - tz * len;
                  double bx = fcx + tx * len, bz = fcz + tz * len;
                  double xa = ax * c + az * s, xb = bx * c + bz * s;
                  double depth = -fcx * s + fcz * c;
                  double light = 0.6 + 0.4 * nzr;

                  jobs.add(new Job(depth, () -> {
                      for (int i = 0; i < cols; i++) {
                          double u0 = (double) i / cols, u1 = (double) (i + 1) / cols;
                          int sx0 = (int) Math.round(cx + (xa + (xb - xa) * u0) * k);
                          int sx1 = (int) Math.round(cx + (xa + (xb - xa) * u1) * k);
                          int lo = Math.min(sx0, sx1), hi = Math.max(sx0, sx1);
                          if (lo == hi) continue;
                          for (int j = 0; j < rows; j++) {
                              double v0 = (double) j / rows, v1 = (double) (j + 1) / rows;
                              int sy0 = (int) Math.round(baseY - (y1 - (y1 - y0) * v0) * k);
                              int sy1 = (int) Math.round(baseY - (y1 - (y1 - y0) * v1) * k);
                              int col = tex.at((u0 + u1) / 2, (v0 + v1) / 2);
                              if ((col >>> 24) < 128) continue;
                              ctx.fill(lo, sy0, hi, sy1, shade(col, light));
                          }
                      }
                  }));
              }

              private static void box(List<Job> jobs, DrawContext ctx, double th, int cx, int baseY, float k,
                                      double xc, double zc, double hx, double hz, double y0, double y1,
                                      Tex front, int fc, int fr, Tex back, int bc, int br, Tex side, int sc, int sr) {
                  face(jobs, ctx, th, cx, baseY, k, xc, zc + hz, 0, 1, hx, y0, y1, front, fc, fr);
                  face(jobs, ctx, th, cx, baseY, k, xc, zc - hz, 0, -1, hx, y0, y1, back, bc, br);
                  face(jobs, ctx, th, cx, baseY, k, xc + hx, zc, 1, 0, hz, y0, y1, side, sc, sr);
                  face(jobs, ctx, th, cx, baseY, k, xc - hx, zc, -1, 0, hz, y0, y1, side, sc, sr);
              }

              public static void draw(DrawContext ctx, int cx, int baseY, float k, double angleDeg,
                                      CapeData cape, boolean elytra) {
                  double th = Math.toRadians(angleDeg);
                  List<Job> jobs = new ArrayList<>();

                  final int SKIN = 0xFFC6916A, HAIR = 0xFF3A2A1A, SHIRT = 0xFF2CA6A6, PANTS = 0xFF3B4A9C;

                  Tex headFront = (u, v) -> {
                      int gx = (int) (u * 8), gy = (int) (v * 8);
                      if (gy < 2) return HAIR;
                      if (gy == 4) {
                          if (gx == 1 || gx == 6) return 0xFFFFFFFF;
                          if (gx == 2 || gx == 5) return 0xFF3A3AA0;
                      }
                      if (gy == 6 && (gx == 3 || gx == 4)) return 0xFF8B5A3C;
                      return SKIN;
                  };
                  Tex headSide = (u, v) -> v < 0.25 ? HAIR : SKIN;
                  Tex arm = (u, v) -> v < 0.3 ? SHIRT : SKIN;

                  // kaki
                  box(jobs, ctx, th, cx, baseY, k, -2, 0, 2, 2, 0, 12,
                          solid(PANTS), 1, 1, solid(PANTS), 1, 1, solid(PANTS), 1, 1);
                  box(jobs, ctx, th, cx, baseY, k, 2, 0, 2, 2, 0, 12,
                          solid(PANTS), 1, 1, solid(PANTS), 1, 1, solid(PANTS), 1, 1);
                  // badan
                  box(jobs, ctx, th, cx, baseY, k, 0, 0, 4, 2, 12, 24,
                          solid(SHIRT), 1, 1, solid(SHIRT), 1, 1, solid(SHIRT), 1, 1);
                  // tangan
                  box(jobs, ctx, th, cx, baseY, k, -6, 0, 2, 2, 12, 24, arm, 1, 4, arm, 1, 4, arm, 1, 4);
                  box(jobs, ctx, th, cx, baseY, k, 6, 0, 2, 2, 12, 24, arm, 1, 4, arm, 1, 4, arm, 1, 4);
                  // kepala
                  box(jobs, ctx, th, cx, baseY, k, 0, 0, 4, 4, 24, 32,
                          headFront, 8, 8, solid(HAIR), 1, 1, headSide, 8, 8);

                  if (!elytra && cape != null) {
                      final CapeData cd = cape;
                      Tex outer = (u, v) -> cd.sample(1 + u * 10, 1 + v * 16);
                      box(jobs, ctx, th, cx, baseY, k, 0, -2.6, 5, 0.5, 8, 24,
                              solid(shade(cd.avg, 0.7)), 1, 1, outer, 10, 16, solid(cd.avg), 1, 1);
                  }

                  if (elytra) {
                      for (int sign = -1; sign <= 1; sign += 2) {
                          final boolean mirror = sign > 0;
                          final CapeData cd = cape;
                          Tex outer;
                          Tex inner;
                          Tex side;
                          if (cd == null) {
                              outer = solid(0xFF9AA0A8);
                              inner = solid(0xFF6E737A);
                              side = solid(0xFF8A8F96);
                          } else {
                              outer = (u, v) -> cd.sample(24 + (mirror ? 1 - u : u) * 10, 2 + v * 20);
                              inner = solid(shade(cd.avg, 0.7));
                              side = solid(cd.avg);
                          }
                          box(jobs, ctx, th, cx, baseY, k, sign * 5, -2.7, 4.5, 0.5, 4, 24,
                                  inner, 1, 1, outer, 10, 20, side, 1, 1);
                      }
                  }

                  jobs.sort(Comparator.comparingDouble(Job::depth));
                  ctx.fill(cx - 36, baseY, cx + 36, baseY + 1, 0x55FFFFFF);
                  for (Job j : jobs) j.run().run();
              }
          }
          EOF

