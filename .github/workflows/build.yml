          cat > src/main/java/com/example/clientcapes/CapeScreen.java <<'EOF'
          package com.example.clientcapes;

          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.nio.file.StandardCopyOption;
          import java.util.ArrayList;
          import java.util.List;

          public class CapeScreen extends Screen {
              private static final int PER_PAGE = 9;
              private static String pending = null;
              private static int page = 0;

              private int px, py, pw, ph, pvx, pvy, pvw, pvh, cx0, tw, th;
              private boolean elytra = false;
              private float angle = 205f;
              private boolean dragging;
              private int lastMx;
              private long lastNano;
              private String status = "";
              private long statusUntil;

              private List<Capes.Entry> entries = new ArrayList<>();
              private final List<ButtonWidget> tileBtns = new ArrayList<>();
              private final List<Capes.Entry> tileEntries = new ArrayList<>();
              private ButtonWidget tabNo, tabEly, selectBtn, spinBtn, prevBtn, nextBtn, refreshBtn, serverBtn;

              public CapeScreen() {
                  super(Text.literal("Cape Menu"));
              }

              private int maxPage() {
                  return Math.max(0, (entries.size() - 1) / PER_PAGE);
              }

              @Override
              protected void init() {
                  pw = Math.min(this.width - 16, 360);
                  ph = Math.min(this.height - 16, 230);
                  px = (this.width - pw) / 2;
                  py = (this.height - ph) / 2;
                  pvw = Math.min(162, pw / 2 - 10);
                  pvx = px + 8;
                  pvy = py + 34;
                  pvh = ph - 68;
                  cx0 = pvx + pvw + 6;
                  int areaW = px + pw - 8 - cx0;
                  tw = (areaW - 8) / 3;
                  th = Math.max(40, (pvh - 8) / 3);
                  lastNano = System.nanoTime();

                  entries = Capes.entries();
                  if (pending == null) pending = CapeConfig.get().capeKey;
                  if (page > maxPage()) page = maxPage();

                  tileBtns.clear();
                  tileEntries.clear();
                  for (int i = 0; i < PER_PAGE; i++) {
                      int idx = page * PER_PAGE + i;
                      if (idx >= entries.size()) break;
                      Capes.Entry e = entries.get(idx);
                      int x = cx0 + (i % 3) * (tw + 4);
                      int y = pvy + (i / 3) * (th + 4);
                      ButtonWidget b = ButtonWidget.builder(Text.empty(), btn -> pending = e.key())
                              .dimensions(x, y, tw, th).build();
                      addDrawableChild(b);
                      tileBtns.add(b);
                      tileEntries.add(e);
                  }

                  int by = pvy + pvh + 4;
                  tabNo = ButtonWidget.builder(Text.empty(), b -> elytra = false)
                          .dimensions(pvx, by, pvw / 2 - 2, 18).build();
                  tabEly = ButtonWidget.builder(Text.empty(), b -> elytra = true)
                          .dimensions(pvx + pvw / 2 + 2, by, pvw / 2 - 2, 18).build();
                  addDrawableChild(tabNo);
                  addDrawableChild(tabEly);

                  prevBtn = ButtonWidget.builder(Text.empty(), b -> {
                      if (page > 0) {
                          page--;
                          this.client.setScreen(new CapeScreen());
                      }
                  }).dimensions(cx0, by, 26, 18).build();
                  nextBtn = ButtonWidget.builder(Text.empty(), b -> {
                      if (page < maxPage()) {
                          page++;
                          this.client.setScreen(new CapeScreen());
                      }
                  }).dimensions(cx0 + 30, by, 26, 18).build();
                  refreshBtn = ButtonWidget.builder(Text.empty(), b -> {
                      Capes.clearCache();
                      this.client.setScreen(new CapeScreen());
                  }).dimensions(cx0 + 60, by, 56, 18).build();
                  addDrawableChild(prevBtn);
                  addDrawableChild(nextBtn);
                  addDrawableChild(refreshBtn);

                  selectBtn = ButtonWidget.builder(Text.empty(), b -> {
                      CapeConfig.get().capeKey = pending == null ? "" : pending;
                      CapeConfig.save();
                      CapeSync.needUpload = true;
                      status = CapeNet.enabled() && CapeConfig.get().shareOwn
                              ? "Cape diterapkan & dikirim" : "Cape diterapkan!";
                      statusUntil = System.currentTimeMillis() + 2500;
                  }).dimensions(pvx + pvw - 54, pvy + pvh - 22, 50, 18).build();
                  spinBtn = ButtonWidget.builder(Text.empty(), b -> {
                      CapeConfig.get().autoSpin = !CapeConfig.get().autoSpin;
                      CapeConfig.save();
                  }).dimensions(pvx + pvw - 46, pvy + 4, 42, 14).build();
                  addDrawableChild(selectBtn);
                  addDrawableChild(spinBtn);

                  serverBtn = ButtonWidget.builder(Text.empty(), b -> this.client.setScreen(new NetScreen()))
                          .dimensions(px + pw - 76, py + 8, 68, 20).build();
                  addDrawableChild(serverBtn);
              }

              /** Drag & drop file PNG ke layar ini untuk menambah cape custom. */
              public void onFilesDropped(List<Path> paths) {
                  int n = 0;
                  for (Path p : paths) {
                      String name = p.getFileName().toString();
                      if (!name.toLowerCase().endsWith(".png")) continue;
                      try {
                          Files.createDirectories(Capes.dir());
                          String safe = name.replaceAll("[^A-Za-z0-9._ -]", "_");
                          Files.copy(p, Capes.dir().resolve(safe), StandardCopyOption.REPLACE_EXISTING);
                          n++;
                      } catch (IOException e) {
                          e.printStackTrace();
                      }
                  }
                  if (n > 0) {
                      Capes.clearCache();
                      this.client.setScreen(new CapeScreen());
                  }
              }

              @Override
              public void renderBackground(DrawContext c, int mx, int my, float d) {
                  super.renderBackground(c, mx, my, d);
                  Ui.box(c, px, py, pw, ph, Ui.BG, Ui.BORDER);
              }

              private void overlay(DrawContext c, ButtonWidget b, String text, int bg, int bd) {
                  Ui.box(c, b.getX(), b.getY(), b.getWidth(), b.getHeight(), bg, bd);
                  if (b.isHovered()) {
                      c.fill(b.getX() + 1, b.getY() + 1, b.getX() + b.getWidth() - 1,
                              b.getY() + b.getHeight() - 1, 0x22FFFFFF);
                  }
                  c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(text),
                          b.getX() + b.getWidth() / 2, b.getY() + (b.getHeight() - 8) / 2, 0xFFFFFFFF);
              }

              private String nameOf(String key) {
                  for (Capes.Entry e : entries) {
                      if (e.key().equals(key)) return e.name();
                  }
                  return "?";
              }

              private void drawMini(DrawContext c, int x, int y, CapeData cd) {
                  for (int j = 0; j < 16; j++) {
                      for (int i = 0; i < 10; i++) {
                          int col = cd.sample(1 + i + 0.5, 1 + j + 0.5);
                          if ((col >>> 24) < 128) continue;
                          c.fill(x + i * 2, y + j * 2, x + i * 2 + 2, y + j * 2 + 2, col | 0xFF000000);
                      }
                  }
              }

              @Override
              public void render(DrawContext c, int mx, int my, float d) {
                  super.render(c, mx, my, d);

                  // header
                  c.fill(px + 10, py + 8, px + 140, py + 28, Ui.PILL);
                  c.drawCenteredTextWithShadow(this.textRenderer, Text.literal("Cape Menu"), px + 75, py + 14, 0xFFFFFFFF);
                  String net = CapeNet.status == null ? "" : CapeNet.status;
                  if (!net.isEmpty()) {
                      c.drawTextWithShadow(this.textRenderer,
                              Text.literal(this.textRenderer.trimToWidth(net, pw - 76 - 150)),
                              px + 146, py + 14, 0xFFFFDD66);
                  }
                  overlay(c, serverBtn, "Server", CapeNet.enabled() ? Ui.GREEN_BG : 0xFF22222F,
                          CapeNet.enabled() ? Ui.GREEN_BD : Ui.BORDER);

                  // area preview
                  Ui.box(c, pvx, pvy, pvw, pvh, 0xFF101018, Ui.BORDER);

                  // rotasi: drag mouse di area preview + putar otomatis
                  long now = System.nanoTime();
                  double dt = Math.min(0.1, (now - lastNano) / 1e9);
                  lastNano = now;
                  boolean down = GLFW.glfwGetMouseButton(this.client.getWindow().getHandle(),
                          GLFW.GLFW_MOUSE_BUTTON_LEFT) == GLFW.GLFW_PRESS;
                  boolean inPreview = mx >= pvx && mx < pvx + pvw && my >= pvy && my < pvy + pvh;
                  if (down) {
                      if (!dragging && inPreview && !selectBtn.isHovered() && !spinBtn.isHovered()) {
                          dragging = true;
                          lastMx = mx;
                      } else if (dragging) {
                          angle += (mx - lastMx) * 1.3f;
                          lastMx = mx;
                      }
                  } else {
                      dragging = false;
                  }
                  if (!dragging && CapeConfig.get().autoSpin) angle += (float) (dt * 25.0);

                  CapeData cd = (pending == null || pending.isEmpty()) ? null : Capes.get(pending);
                  float k = Math.max(2f, (pvh - 24) / 34f);
                  Preview.draw(c, pvx + pvw / 2, pvy + pvh - 14, k, angle, cd, elytra);

                  c.drawTextWithShadow(this.textRenderer,
                          Text.literal(this.textRenderer.trimToWidth(nameOf(pending), pvw - 56)),
                          pvx + 5, pvy + 6, 0xFFFFFFFF);
                  if (System.currentTimeMillis() < statusUntil) {
                      c.drawTextWithShadow(this.textRenderer, Text.literal(status), pvx + 5, pvy + 18, 0xFF55FF55);
                  }

                  // tombol di preview
                  overlay(c, spinBtn, "Putar", CapeConfig.get().autoSpin ? Ui.GREEN_BG : 0xFF22222F,
                          CapeConfig.get().autoSpin ? Ui.GREEN_BD : Ui.BORDER);
                  String active = CapeConfig.get().capeKey;
                  boolean same = (pending == null ? "" : pending).equals(active);
                  overlay(c, selectBtn, same ? "Dipakai" : "Select", same ? 0xFF22222F : Ui.GREEN_BG,
                          same ? Ui.BORDER : Ui.GREEN_BD);

                  // tab elytra
                  overlay(c, tabNo, "Tanpa Elytra", !elytra ? 0xFF3A3A5A : 0xFF22222F, !elytra ? Ui.PILL : Ui.BORDER);
                  overlay(c, tabEly, "Pakai Elytra", elytra ? 0xFF3A3A5A : 0xFF22222F, elytra ? Ui.PILL : Ui.BORDER);

                  // daftar cape
                  for (int i = 0; i < tileBtns.size(); i++) {
                      ButtonWidget b = tileBtns.get(i);
                      Capes.Entry e = tileEntries.get(i);
                      boolean sel = e.key().equals(pending == null ? "" : pending);
                      boolean act = e.key().equals(active);
                      Ui.box(c, b.getX(), b.getY(), b.getWidth(), b.getHeight(),
                              sel ? 0xFF3A2A32 : 0xFF22222F, act ? Ui.GREEN_BD : (sel ? Ui.PILL : Ui.BORDER));
                      if (b.isHovered()) {
                          c.fill(b.getX() + 1, b.getY() + 1, b.getX() + b.getWidth() - 1,
                                  b.getY() + b.getHeight() - 1, 0x22FFFFFF);
                      }
                      int mx0 = b.getX() + (b.getWidth() - 20) / 2;
                      CapeData mini = e.key().isEmpty() ? null : Capes.get(e.key());
                      if (mini != null) {
                          drawMini(c, mx0, b.getY() + 3, mini);
                      } else {
                          c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(e.key().isEmpty() ? "-" : "?"),
                                  b.getX() + b.getWidth() / 2, b.getY() + 14, 0xFFAAAAAA);
                      }
                      String nm = this.textRenderer.trimToWidth(e.name(), b.getWidth() - 4);
                      c.drawCenteredTextWithShadow(this.textRenderer, Text.literal(nm),
                              b.getX() + b.getWidth() / 2, b.getY() + b.getHeight() - 11, 0xFFFFFFFF);
                  }

                  // navigasi
                  overlay(c, prevBtn, "<", 0xFF22222F, Ui.BORDER);
                  overlay(c, nextBtn, ">", 0xFF22222F, Ui.BORDER);
                  overlay(c, refreshBtn, "Refresh", 0xFF22222F, Ui.BORDER);
                  c.drawTextWithShadow(this.textRenderer, Text.literal((page + 1) + "/" + (maxPage() + 1)),
                          cx0 + 122, pvy + pvh + 9, 0xFFFFFFFF);

                  // petunjuk folder
                  String hint = "Taruh PNG di: " + Capes.dir() + "  (atau drag & drop file ke sini)";
                  c.drawTextWithShadow(this.textRenderer,
                          Text.literal(this.textRenderer.trimToWidth(hint, pw - 16)), px + 8, py + ph - 12, 0xFF9999AA);
              }
          }
          EOF

      - name: Build
        working-directory: mod
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: clientcapes-1.21.11
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar

      - name: Upload cape server
        uses: actions/upload-artifact@v4
        with:
          name: cape-server
          path: cape_server.py
